<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIPE HOSTING</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">

        <div class="login-card">

            <div class="logo">
                HIPE <span>HOSTING</span>
            </div>

            <p class="subtitle">
                Acesse seu painel
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div class="footer">
                © 2026 HIPE HOSTING
            </div>

        </div>

    </main>


    <!-- DIALOG DE MANUTENÇÃO -->

    <div class="dialog-overlay" id="maintenanceDialog">

        <div class="dialog">

            <button class="close-button" id="closeDialog">
                ×
            </button>

            <div class="dialog-icon">
                🔧
            </div>

            <h2>
                Estamos em manutenção
            </h2>

            <p>
                Nosso sistema está passando por uma manutenção
                no momento.
            </p>

            <p class="dialog-small">
                Por favor, volte mais tarde.
            </p>

            <p class="dialog-small">
                Voltaremos 00:50!
            </p>

            <button class="dialog-button" id="dialogOk">
                Entendi
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
